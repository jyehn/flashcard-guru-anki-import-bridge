[package]
name = "rust_import_core"
version = "0.1.0"
edition = "2021"
publish = false

# PR 2b: stub FFI shim. PR 3 will add ankitects/anki as a path dependency
# (via git submodule under Vendor/anki-rs) and replace the stub returns with
# real rslib calls. Keeping the dependency surface empty here lets the build
# pipeline (cargo + cbindgen + xcframework) be validated in isolation.

[lib]
name = "rust_import_core"
# iOS links the staticlib (scripts/build-xcframework.sh). Android needs a cdylib,
# which scripts/build-android.sh requests with `cargo rustc --crate-type cdylib`
# so this line, and therefore the iOS build, stays exactly as it was.
crate-type = ["staticlib"]

[features]
# The default feature set is what iOS has always built: rslib with native-tls.
default = ["native-tls"]
# rslib's sync client needs one TLS backend to type-check; the bridge never uses
# sync. native-tls pulls OpenSSL when cross-compiling for Android, so Android
# selects rustls instead.
native-tls = ["anki/native-tls"]
rustls = ["anki/rustls"]
# Android build: rustls (no OpenSSL) plus the JNI layer in src/android_jni.rs.
# Build with `--no-default-features --features android`.
android = ["rustls", "dep:jni"]

[dependencies]
# rslib is large and uses native-tls for its sync layer. We don't use sync, but
# the feature is required for the crate to type-check (without it, async-compression
# trait bounds in src/sync/request/header_and_stream.rs fail to resolve).
# The TLS feature is chosen by this crate's `native-tls` / `rustls` features above.
anki = { path = "../anki-rs/rslib" }
# Generated protobuf types used by anki's import API (ImportAnkiPackageOptions etc.)
anki_proto = { path = "../anki-rs/rslib/proto" }
# SM-2 → FSRS conversion (memory_state_from_sm2). Already a transitive dep
# of anki, named here so we can call it directly without going through rslib.
fsrs = "5.2"
# JSON parser for the cards.data column (serialised CardData blob).
serde_json = "1"
# Direct SQL access to the populated Collection (Card scheduling fields are
# pub(crate) inside rslib, so we read the cards table by hand).
rusqlite = { version = "0.36", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }

# JNI bindings for the Android build only (feature `android`).
jni = { version = "0.21", optional = true }

[dev-dependencies]
regex = "1"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
